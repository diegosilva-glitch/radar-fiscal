name: Atualizar Radar Fiscal

on:
  schedule:
      # Horarios em UTC (Brasilia = UTC-3, sem horario de verao):
          # 06:00 BRT -> 09:00 UTC
              # 12:00 BRT -> 15:00 UTC
                  # 18:00 BRT -> 21:00 UTC
                      # 00:00 BRT -> 03:00 UTC
                          - cron: '0 9 * * *'
                              - cron: '0 15 * * *'
                                  - cron: '0 21 * * *'
                                      - cron: '0 3 * * *'
                                        workflow_dispatch: {}

                                        jobs:
                                          atualizar:
                                              runs-on: ubuntu-latest
                                                  steps:
                                                        - name: Baixar o repositorio
                                                                uses: actions/checkout@v4

                                                                      - name: Configurar Python
                                                                              uses: actions/setup-python@v5
                                                                                      with:
                                                                                                python-version: '3.11'

                                                                                                      - name: Instalar dependencias
                                                                                                              run: pip install anthropic pillow
                                                                                                              
                                                                                                                    - name: Gerar icones (se ainda nao existirem)
                                                                                                                            run: python scripts/generate_icons.py
                                                                                                                            
                                                                                                                                  - name: Rodar a varredura e atualizar o site
                                                                                                                                          env:
                                                                                                                                                    ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                                                                                                                                                            run: python scripts/update_radar.py
                                                                                                                                                            
                                                                                                                                                                  - name: Publicar mudancas no repositorio
                                                                                                                                                                          run: |
                                                                                                                                                                                    git config user.name "radar-fiscal-bot"
                                                                                                                                                                                              git config user.email "actions@users.noreply.github.com"
                                                                                                                                                                                                        git add site/
                                                                                                                                                                                                                  git diff --quiet && git diff --staged --quiet || git commit -m "Atualizacao automatica do Radar Fiscal ($(date -u +'%Y-%m-%d %H:%M UTC'))"
                                                                                                                                                                                                                            git push
                                                                                                                                                                                                                            
